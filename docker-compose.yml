services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aulas-backend
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-mqtt://broker.hivemq.com}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - HTTP_PORT=3001
      - WS_PORT=3002
      - DB_PATH=/app/data/noise.db
      - USE_INTERNAL_BROKER=false
      - RAW_RETENTION_DAYS=${RAW_RETENTION_DAYS:-14}
      - MINUTE_RETENTION_DAYS=${MINUTE_RETENTION_DAYS:-180}
    volumes:
      - noise_data:/app/data
    restart: unless-stopped
    networks:
      - aulas

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aulas-frontend
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aulas

  caddy:
    image: caddy:2-alpine
    container_name: aulas-caddy
    environment:
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - aulas

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aulas-cloudflared
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy
    restart: unless-stopped
    networks:
      - aulas

volumes:
  noise_data:
  caddy_data:
  caddy_config:

networks:
  aulas:
    driver: bridge
